<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Cuisine — Envoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:   #F2EDE3;
    --dim:   #B9B2A4;
    --faint: #6E6A60;
    --brass: #C8A862;
    --void:  #121110;
    --panel: #1B1917;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    min-height:100%;
    background:var(--void);
    font-family:'Jost', sans-serif;
    color:var(--ink);
  }

  /* ---- Onglets ---- */
  .tabs{
    display:flex;
    border-bottom:1px solid #2a2825;
    padding:0 8vw;
  }

  .tab{
    flex:1;
    padding:4vw 0;
    text-align:center;
    font-size:0.78rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .25s, border-color .25s;
  }

  .tab.active{
    color:var(--brass);
    border-bottom-color:var(--brass);
  }

  /* ---- Contenu ---- */
  .panel{
    display:none;
    padding:6vw 8vw;
    flex-direction:column;
    gap:4vh;
  }

  .panel.active{ display:flex; }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:300;
    font-size:1.9rem;
    line-height:1.1;
  }

  .rule{
    width:2rem; height:1px;
    background:var(--brass);
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  label{
    font-size:0.72rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--faint);
  }

  input[type="url"],
  input[type="file"]{
    background:var(--panel);
    border:1px solid #2a2825;
    border-radius:10px;
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-size:0.95rem;
    font-weight:300;
    padding:0.9rem 1rem;
    outline:none;
    width:100%;
    transition:border-color .25s;
  }

  input[type="url"]:focus{ border-color:var(--brass); }
  input[type="url"]::placeholder{ color:var(--faint); }

  input[type="file"]{
    color:var(--dim);
    cursor:pointer;
  }

  .hint{
    font-size:0.78rem;
    color:var(--faint);
    line-height:1.5;
  }

  /* Prévisualisation */
  .preview-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:0.5rem;
  }

  .preview-grid img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:8px;
    opacity:0.85;
  }

  /* Bouton principal */
  .btn{
    background:transparent;
    border:1px solid var(--brass);
    color:var(--brass);
    font-family:'Jost', sans-serif;
    font-size:0.85rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    padding:1rem;
    border-radius:999px;
    cursor:pointer;
    width:100%;
    transition:background .25s, color .25s;
  }

  .btn:active{ background:var(--brass); color:var(--void); }
  .btn:disabled{ opacity:0.4; pointer-events:none; }

  /* Barre de progression */
  .progress-bar{
    width:100%;
    height:3px;
    background:#2a2825;
    border-radius:999px;
    overflow:hidden;
    display:none;
  }

  .progress-bar .fill{
    height:100%;
    background:var(--brass);
    width:0%;
    transition:width .3s ease;
  }

  /* Statut */
  .status{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    min-height:1.5rem;
  }

  .status.ok{ color:#5cb85c; }
  .status.err{ color:#d9534f; }
  .status.loading{ color:var(--dim); }

  /* ---- Liste de courses ---- */
  .courses-add{
    display:flex;
    gap:0.6rem;
    align-items:center;
  }

  .courses-add input[type="text"]{
    flex:1;
    background:var(--panel);
    border:1px solid #2a2825;
    border-radius:10px;
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-size:0.95rem;
    font-weight:300;
    padding:0.9rem 1rem;
    outline:none;
    transition:border-color .25s;
  }

  .courses-add input[type="text"]:focus{ border-color:var(--brass); }
  .courses-add input[type="text"]::placeholder{ color:var(--faint); }

  .courses-add .add-btn{
    background:transparent;
    border:1px solid var(--ink-faint);
    color:var(--dim);
    font-size:1.3rem;
    width:42px; height:42px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:border-color .25s, color .25s;
  }

  .courses-add .add-btn:active{ border-color:var(--brass); color:var(--brass); }

  .courses-list{
    display:flex;
    flex-direction:column;
    gap:0;
    max-height:55vh;
    overflow-y:auto;
  }

  .courses-list .c-item{
    display:flex;
    align-items:center;
    gap:0.8rem;
    padding:0.9rem 0;
    border-bottom:1px solid #222120;
    cursor:pointer;
  }

  .courses-list .c-item:last-child{ border-bottom:none; }

  .courses-list .c-dot{
    width:20px; height:20px;
    border:1px solid var(--faint);
    border-radius:50%;
    flex-shrink:0;
    transition:border-color .25s, background .25s;
  }

  .courses-list .c-item.checked .c-dot{
    border-color:var(--brass);
    background:var(--brass);
  }

  .courses-list .c-text{
    flex:1;
    font-size:1rem;
    transition:color .25s;
  }

  .courses-list .c-item.checked .c-text{
    color:var(--faint);
    text-decoration:line-through;
  }

  .courses-list .c-del{
    background:transparent;
    border:none;
    color:var(--faint);
    font-size:1rem;
    cursor:pointer;
    padding:0 0.2rem;
    transition:color .2s;
  }

  .courses-list .c-del:active{ color:#d9534f; }

  .courses-actions{
    display:flex;
    gap:0.8rem;
  }

  .btn-secondary{
    background:transparent;
    border:1px solid var(--faint);
    color:var(--dim);
    font-family:'Jost', sans-serif;
    font-size:0.78rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    padding:0.7rem 1rem;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .25s, color .25s;
  }

  .btn-secondary:active{ border-color:var(--brass); color:var(--brass); }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="photos">📷 Photos</div>
  <div class="tab" data-tab="recette">🍽️ Recette</div>
  <div class="tab" data-tab="courses">🛒 Courses</div>
</div>

<!-- ========== ONGLET PHOTOS ========== -->
<div class="panel active" id="tab-photos">
  <h1>Ajouter des photos</h1>
  <div class="rule"></div>

  <div class="field">
    <label>Sélectionner des photos</label>
    <input type="file" id="photoInput" accept="image/*" multiple />
  </div>

  <div class="preview-grid" id="previewGrid"></div>

  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <button class="btn" id="uploadBtn" disabled>Envoyer sur l'iPad</button>
  <div class="status" id="photoStatus"></div>
</div>

<!-- ========== ONGLET RECETTE ========== -->
<div class="panel" id="tab-recette">
  <h1>Envoyer une recette</h1>
  <div class="rule"></div>

  <div class="field">
    <label>URL de la recette</label>
    <input type="url" id="urlInput" placeholder="https://www.marmiton.org/..." />
    <p class="hint">Depuis Safari : Partager → Copier le lien, puis colle-le ici.</p>
  </div>

  <button class="btn" id="sendBtn">Envoyer sur l'iPad</button>
  <div class="status" id="recStatus"></div>
</div>

<!-- ========== ONGLET COURSES ========== -->
<div class="panel" id="tab-courses">
  <h1>Liste de courses</h1>
  <div class="rule"></div>

  <div class="courses-add">
    <input type="text" id="courseInput" placeholder="Ajouter un article..." />
    <button class="add-btn" id="courseAddBtn">+</button>
  </div>

  <div class="courses-list" id="coursesList">
    <div style="color:var(--faint);font-style:italic;font-family:'Cormorant Garamond',serif;padding:1rem 0">Chargement...</div>
  </div>

  <div class="courses-actions">
    <button class="btn-secondary" id="clearCheckedBtn">Supprimer cochés</button>
    <button class="btn-secondary" id="clearAllBtn">Tout effacer</button>
  </div>

  <div class="status" id="courseStatus"></div>
</div>

<script>
/* =====================================================================
   Config
   ===================================================================== */
const CLOUD_NAME   = 'xnw6fyno';
const UPLOAD_PRESET = 'zwrvbuwk';
const FOLDER       = 'cuisine_ipad/photos';

const JSONBIN_KEY  = '$2a$10$9YaBpBSOiqeKUl0kFoBFzutTh9UVYO0aij7HFswRCfw4XnNd52W6y';
const JSONBIN_BIN  = '6a8aa1e0da38895dfe062351';

/* =====================================================================
   Onglets
   ===================================================================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

/* =====================================================================
   Upload photos → Cloudinary
   ===================================================================== */
const photoInput   = document.getElementById('photoInput');
const previewGrid  = document.getElementById('previewGrid');
const uploadBtn    = document.getElementById('uploadBtn');
const progressBar  = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const photoStatus  = document.getElementById('photoStatus');

photoInput.addEventListener('change', () => {
  previewGrid.innerHTML = '';
  const files = Array.from(photoInput.files);
  if(!files.length){ uploadBtn.disabled = true; return; }

  files.forEach(file => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    previewGrid.appendChild(img);
  });

  uploadBtn.disabled = false;
  photoStatus.textContent = '';
  photoStatus.className = 'status';
});

const NETLIFY_FN = 'https://inspiring-praline-af7c93.netlify.app/.netlify/functions/photos';

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // data:image/jpeg;base64,...
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

uploadBtn.addEventListener('click', async () => {
  const files = Array.from(photoInput.files);
  if(!files.length) return;

  uploadBtn.disabled = true;
  progressBar.style.display = 'block';
  photoStatus.textContent = `Envoi de 0 / ${files.length}...`;
  photoStatus.className = 'status loading';

  let done = 0;
  let errors = 0;

  for(const file of files){
    try{
      const base64 = await fileToBase64(file);

      const res = await fetch(NETLIFY_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64 })
      });

      const data = await res.json();
      if(!data.success) throw new Error(JSON.stringify(data.error));
      done++;
    }catch(e){
      errors++;
    }

    const progress = Math.round(((done + errors) / files.length) * 100);
    progressFill.style.width = progress + '%';
    photoStatus.textContent = `Envoi de ${done + errors} / ${files.length}...`;
  }

  progressBar.style.display = 'none';
  progressFill.style.width = '0%';
  uploadBtn.disabled = false;
  photoInput.value = '';
  previewGrid.innerHTML = '';

  if(errors === 0){
    photoStatus.textContent = `✓ ${done} photo${done > 1 ? 's' : ''} envoyée${done > 1 ? 's' : ''} !`;
    photoStatus.className = 'status ok';
  } else {
    photoStatus.textContent = `${done} envoyée${done > 1 ? 's' : ''}, ${errors} erreur${errors > 1 ? 's' : ''}.`;
    photoStatus.className = 'status err';
  }
});

/* =====================================================================
   Envoi recette → JSONbin
   ===================================================================== */
document.getElementById('sendBtn').addEventListener('click', async () => {
  const url = document.getElementById('urlInput').value.trim();
  const recStatus = document.getElementById('recStatus');

  if(!url){
    recStatus.textContent = 'Colle une URL d\'abord.';
    recStatus.className = 'status err';
    return;
  }

  recStatus.textContent = 'Envoi en cours...';
  recStatus.className = 'status loading';

  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ recette: url })
    });

    if(!res.ok) throw new Error();
    recStatus.textContent = '✓ Recette envoyée sur l\'iPad !';
    recStatus.className = 'status ok';
    document.getElementById('urlInput').value = '';
  }catch(e){
    recStatus.textContent = 'Erreur lors de l\'envoi. Réessaie.';
    recStatus.className = 'status err';
  }
});

/* =====================================================================
   Liste de courses → JSONbin
   ===================================================================== */
const COURSES_BIN  = '6a8aab1cda38895dfe06364c';
const coursesList  = document.getElementById('coursesList');
const courseInput  = document.getElementById('courseInput');
const courseStatus = document.getElementById('courseStatus');
let courses = [];

async function loadCourses(){
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${COURSES_BIN}/latest`, {
      headers:{ 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    courses = data.record?.items || [];
    renderCourses();
  }catch(e){
    coursesList.innerHTML = '<div style="color:var(--faint);font-style:italic;font-family:\'Cormorant Garamond\',serif;padding:1rem 0">Erreur de chargement</div>';
  }
}

async function saveCourses(){
  courseStatus.textContent = '...';
  courseStatus.className = 'status loading';
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${COURSES_BIN}`, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ items: courses })
    });
    if(!res.ok) throw new Error();
    courseStatus.textContent = '✓ Liste sauvegardée';
    courseStatus.className = 'status ok';
    setTimeout(() => { courseStatus.textContent = ''; courseStatus.className = 'status'; }, 2000);
  }catch(e){
    courseStatus.textContent = 'Erreur de sauvegarde';
    courseStatus.className = 'status err';
  }
}

function renderCourses(){
  if(!courses.length){
    coursesList.innerHTML = '<div style="color:var(--faint);font-style:italic;font-family:\'Cormorant Garamond\',serif;padding:1rem 0">Liste vide</div>';
    return;
  }
  coursesList.innerHTML = '';
  courses.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'c-item' + (item.checked ? ' checked' : '');

    const dot = document.createElement('span');
    dot.className = 'c-dot';
    dot.addEventListener('click', () => {
      courses[i].checked = !courses[i].checked;
      renderCourses();
      saveCourses();
    });

    const text = document.createElement('span');
    text.className = 'c-text';
    text.textContent = item.text;
    text.addEventListener('click', () => {
      courses[i].checked = !courses[i].checked;
      renderCourses();
      saveCourses();
    });

    const del = document.createElement('button');
    del.className = 'c-del';
    del.textContent = '✕';
    del.addEventListener('click', () => {
      courses.splice(i, 1);
      renderCourses();
      saveCourses();
    });

    div.appendChild(dot);
    div.appendChild(text);
    div.appendChild(del);
    coursesList.appendChild(div);
  });
}

function addCourse(){
  const val = courseInput.value.trim();
  if(!val) return;
  courses.push({ text: val, checked: false });
  courseInput.value = '';
  renderCourses();
  saveCourses();
}

document.getElementById('courseAddBtn').addEventListener('click', addCourse);
courseInput.addEventListener('keydown', e => { if(e.key === 'Enter') addCourse(); });

document.getElementById('clearCheckedBtn').addEventListener('click', () => {
  courses = courses.filter(i => !i.checked);
  renderCourses();
  saveCourses();
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
  if(!confirm('Effacer toute la liste ?')) return;
  courses = [];
  renderCourses();
  saveCourses();
});

// Charger la liste quand on ouvre l'onglet Courses
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.dataset.tab === 'courses') loadCourses();
  });
});

// Chargement initial si onglet actif
loadCourses();
</script>
</body>
</html>
